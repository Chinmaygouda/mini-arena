<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Arena — Browser FPS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0d0f12;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      #hud-overlay {
        position: absolute;
        top: 16px;
        right: 16px;
        background: rgba(13, 15, 18, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(8px);
        padding: 12px 16px;
        border-radius: 8px;
        color: #e2e8f0;
        font-size: 13px;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .hud-title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 6px;
      }
      .hud-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 4px;
      }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-weight: 600;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }
      .badge-webgpu {
        background: rgba(34, 197, 94, 0.2);
        color: #4ade80;
        border: 1px solid rgba(34, 197, 94, 0.4);
      }
      .badge-webgl2 {
        background: rgba(245, 158, 11, 0.2);
        color: #fbbf24;
        border: 1px solid rgba(245, 158, 11, 0.4);
      }
      .hud-tip {
        margin-top: 8px;
        font-size: 11px;
        color: #94a3b8;
      }
      .hud-tip code {
        color: #e2e8f0;
        background: rgba(255, 255, 255, 0.08);
        padding: 1px 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud-overlay">
      <div class="hud-title">Mini Arena — Phase 0</div>
      <div class="hud-row">
        <span>Active Backend:</span>
        <span id="renderer-badge" class="badge">Initializing...</span>
      </div>
      <div class="hud-tip">
        Tip: test fallback with <code>?forceWebGL</code>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
