name: Neighborhood Rebuild Checks

on:
  push:
    branches:
      - neighborhood-rebuild
  pull_request:
    paths:
      - "public/maps/neighborhood.json"
      - "src/environment/blueprintMapLoader.ts"
      - "tests/neighborhoodMap.test.mjs"
      - "tests/neighborhoodTraversal.playwright.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/neighborhood-rebuild-checks.yml"

jobs:
  build-and-map-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compile and bundle
        run: npm run build
      - name: Run neighborhood map tests
        run: node --experimental-strip-types --test tests/neighborhoodMap.test.mjs
      - name: Install Chromium for traversal tests
        run: npx playwright install --with-deps chromium
      - name: Run browser-driven neighborhood traversal
        run: node tests/neighborhoodTraversal.playwright.mjs
      - name: Upload neighborhood browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neighborhood-traversal-screenshots
          path: artifacts/neighborhood-preview/
          if-no-files-found: warn
          retention-days: 7
